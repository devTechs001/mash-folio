<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f242d" />

    <title>Mash — Full-Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Mash — a Nairobi-based full-stack developer crafting fast, accessible web products with React, Node.js and Tailwind CSS."
    />
    <meta name="author" content="Mash" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mash — Full-Stack Developer" />
    <meta
      property="og:description"
      content="I design and build fast, accessible web products — from the first wireframe to the final deploy."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2311161d'/%3E%3Cpath d='M16 46V18l16 14 16-14v28' stroke='%2300e5ff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var savedTheme = localStorage.getItem('mash-folio-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (error) {
        /* localStorage can be unavailable — fall back to the default theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
