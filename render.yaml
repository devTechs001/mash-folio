# Render Blueprint — Node web service that serves the API and the built SPA.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mash-folio
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      # Owner credentials — `sync: false` asks for the value in the Render
      # dashboard instead of storing secrets in git.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_HOURS
        value: "8"
      # Optional: attach a Render disk mounted at /var/data and uncomment to
      # keep content/messages across deploys (disks need a paid instance type).
      # - key: DATA_DIR
      #   value: /var/data
