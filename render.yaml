# Render Blueprint — static site with SPA routing.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mash-folio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      # Owner dashboard credentials. `sync: false` asks for the value once in the
      # Render dashboard instead of storing it in git.
      - key: VITE_ADMIN_EMAIL
        sync: false
      - key: VITE_ADMIN_PASSWORD_HASH
        sync: false
      - key: VITE_ADMIN_SESSION_HOURS
        value: "8"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
